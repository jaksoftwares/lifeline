name: lifeline

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lifeline
      POSTGRES_PASSWORD: lifeline
      POSTGRES_DB: lifeline
    ports:
      - '5442:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeline']
      interval: 5s
      timeout: 5s
      retries: 10

  # Used from Phase 5 (realtime fan-out) and Phase 7 (escalation timers).
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
